set -g default-terminal "tmux-256color"
set -s escape-time 0
set -ag terminal-overrides ",*:RGB"
set -g renumber-windows on
bind c new-window -c "#{pane_current_path}"

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 60
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme
# Fallback palette. These are ANSI names, so they follow whatever the terminal
# theme calls them. ~/.local/scripts/tmux-bar overrides them with the exact hex
# values from Omarchy's colors.toml on server start and on every theme switch,
# mirroring the lualine bar: one solid dark_background strip, accent caps, muted
# inactive windows, and mode-coloured caps.
set -g @bar_bg "default"
set -g @bar_accent "blue"
set -g @bar_dark "black"
set -g @bar_muted "brightblack"
set -g @bar_yellow "yellow"
set -g @bar_orange "yellow"
set -g @bar_magenta "magenta"

# Both caps take their colour from the mode, like lualine's a/z sections share
# the mode accent: idle -> yellow (normal), prefix pending -> orange (command),
# copy mode -> magenta (visual).
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#{@bar_dark},bg=#{?pane_in_mode,#{@bar_magenta},#{?client_prefix,#{@bar_orange},#{@bar_yellow}}},bold] #S  #[fg=#{?pane_in_mode,#{@bar_magenta},#{?client_prefix,#{@bar_orange},#{@bar_yellow}}},bg=#{@bar_bg}]"
set -g status-right "#[fg=#{@bar_accent}]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#{?pane_in_mode,#{@bar_magenta},#{?client_prefix,#{@bar_orange},#{@bar_yellow}}},bg=#{@bar_bg}]#[fg=#{@bar_dark},bg=#{?pane_in_mode,#{@bar_magenta},#{?client_prefix,#{@bar_orange},#{@bar_yellow}}},bold]  #h  "
set -g window-status-format "#[fg=#{@bar_muted},bg=#{@bar_bg}] #I:#W "
set -g window-status-current-format "#[fg=#{@bar_accent},bg=#{@bar_bg}] #I:#W "
# tmux 3.8 defaults this to "underscore", which draws a line under the current
# window; the colour in the format above is all the emphasis we want.
set -g window-status-current-style "default"
set -g window-status-activity-style "fg=yellow,bg=default"
set -g window-status-bell-style "fg=red,bg=default"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue,fill=default,width=100%,align=left"
set -g message-command-style "bg=default,fg=blue,fill=default,width=100%,align=left"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Paint the bar from the current Omarchy palette (no-op when unavailable).
run-shell '[ -x ~/.local/scripts/tmux-bar ] && ~/.local/scripts/tmux-bar || true'

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# easy window swapping
bind -r u select-window -t 1
bind -r i select-window -t 2
bind -r o select-window -t 3
bind -r p select-window -t 4
# bind -r [ select-window -t 5

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind-key -r C-f run-shell "tmux neww ~/dev-env/tmux-sessionizer"
bind-key -r M-h run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -r M-t run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -r M-n run-shell "tmux neww tmux-sessionizer -s 2"

bind r source-file ~/.config/tmux/tmux.conf

bind-key -r C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
